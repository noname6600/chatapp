# ─── Upstream pools for duplicated services ───────────────────────────────────
upstream frontend_upstream {
    least_conn;
    server chatappbe-frontend:80;
    keepalive 16;
}

# Use container names (not service aliases) so each entry always resolves to
# exactly one IP. Service aliases can round-robin at DNS level, causing both
# entries to resolve to the same instance and break load balancing.
upstream gateway_upstream {
    least_conn;
    server chatappbe-gateway-service:8080;
    server chatappbe-gateway-service-2:8080;
    keepalive 32;
}

# Direct WebSocket upstream — bypasses gateway so Nginx does the load balancing.
upstream realtime_upstream {
    least_conn;
    server chatappbe-realtime-edge-service:8090;
    server chatappbe-realtime-edge-service-2:8090;
}

# LiveKit SFU — two nodes in distributed mode (Redis-backed).
# Media (audio/video) flows directly over UDP ports 50000-50500, not through Nginx.
upstream livekit_upstream {
    least_conn;
    server chatapp-livekit:7880;
    # chatapp-livekit-2 intentionally excluded: it shares livekit.yaml's rtc
    # port range with the primary node but never got its own TURN/ICE UDP
    # ports (3478, 50000-50500) published to the host (see docker-compose.yml),
    # so a client whose signaling WebSocket lands here via load balancing
    # advertises unreachable ICE candidates — WebRTC then fails with
    # "could not establish pc connection". Re-enable once it has its own
    # distinct port range configured and published.
    # server chatapp-livekit-2:7880;
}

# ─── HTTP: metrics.chatweb.nani.id.vn → Grafana (no HTTPS needed, personal use) ─
server {
    listen 80;
    server_name metrics.chatweb.nani.id.vn;

    location / {
        proxy_pass          http://grafana:3000;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_buffering     off;
    }
}

# ─── HTTP: ACME challenge + redirect to HTTPS ─────────────────────────────────
server {
    listen 80;
    server_name chatweb.nani.id.vn api.chatweb.nani.id.vn livekit.chatweb.nani.id.vn;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: LiveKit signaling — livekit.chatweb.nani.id.vn ───────────────────
# Proxies LiveKit's WebSocket signaling channel only.
# Actual media (audio/video) bypasses Nginx entirely via UDP ports 50000-50500.
server {
    listen 443 ssl;
    http2 on;
    server_name livekit.chatweb.nani.id.vn;

    # Cert lineage got renamed to -0001 by certbot: a stale/invalid renewal
    # config already existed for the unsuffixed name when this was reissued.
    ssl_certificate     /etc/letsencrypt/live/livekit.chatweb.nani.id.vn-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.chatweb.nani.id.vn-0001/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass             http://livekit_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_buffering        off;
    }
}

# ─── HTTPS: Frontend — chatweb.nani.id.vn ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name chatweb.nani.id.vn;

    ssl_certificate     /etc/letsencrypt/live/chatweb.nani.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatweb.nani.id.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://frontend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ─── HTTPS: Backend API + WebSocket — api.chatweb.nani.id.vn ──────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.chatweb.nani.id.vn;

    ssl_certificate     /etc/letsencrypt/live/api.chatweb.nani.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chatweb.nani.id.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket proxy — goes directly to realtime-edge instances (least_conn).
    # Strips /ws/ prefix: /ws/realtime?ticket=x → /realtime?ticket=x
    # realtime-edge does its own ticket/JWT validation so gateway is not needed.
    location /ws/ {
        rewrite                ^/ws/(.*)$ /$1 break;
        proxy_pass             http://realtime_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP          $remote_addr;
        proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto  $scheme;
        add_header             X-Upstream-Addr    $upstream_addr always;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # REST API proxy — do NOT add CORS headers here; gateway handles CORS policy
    location / {
        proxy_pass             http://gateway_upstream;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        add_header             X-Upstream-Addr   $upstream_addr always;
    }
}
