server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  session:
    store-type: redis
    redis:
      namespace: auth-service:session
    timeout: 600s

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 2000
        delivery.timeout.ms: 3000
        request.timeout.ms: 2000

  datasource:
    url: ${AUTH_DATABASE_URL:jdbc:postgresql://localhost:5432/auth_service}
    username: ${AUTH_DATABASE_USER:auth_user}
    password: ${AUTH_DATABASE_PASSWORD:auth_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    serialization:
      write-dates-as-timestamps: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile
            redirect-uri: ${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email

resend:
  api-key: ${RESEND_API_KEY}
  from: ${RESEND_FROM}
  base-url: ${RESEND_BASE_URL:https://api.resend.com}

auth:
  jwt:
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 2592000000
    issuer: ${AUTH_JWT_ISSUER:http://auth-service:8081}

  oauth:
    exchange-expiration-ms: ${AUTH_OAUTH_EXCHANGE_EXPIRATION_MS:120000}

  signing-key:
    algorithm: RSA
    key-size: 2048
    rotation-ms: 86400000
    grace-period-ms: 1800000

app:
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:5173}
    reset-password-url: ${FRONTEND_URL:http://localhost:5173}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8082/api/v1/users}

internal:
  auth:
    header: ${INTERNAL_AUTH_HEADER:X-Internal-Service-Token}
    token: ${INTERNAL_AUTH_TOKEN:dev-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info

common:
  security:
    cors:
      allowed-origins:
        - ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId}]"
