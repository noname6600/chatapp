global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8082']

  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chat-service:8083']

  - job_name: presence-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['presence-service:8084']

  - job_name: friendship-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['friendship-service:8085']

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8086']

  - job_name: upload-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['upload-service:8088']

  - job_name: realtime-edge-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['realtime-edge-service:8090']

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway-service:8080']
