apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    editable: false
    jsonData:
      derivedFields:
        # Extracts the 32-char hex trace ID from log pattern:
        # "%5p [service-name,hostname,<trace_id>,<span_id>]"
        - datasourceUid: tempo
          matcherRegex: ',([0-9a-f]{32}),'
          name: TraceID
          url: '${__value.raw}'
          urlDisplayLabel: Open in Tempo
