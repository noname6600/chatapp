global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.resend.com:587'
  smtp_from: '$RESEND_FROM'
  smtp_auth_username: 'resend'
  smtp_auth_password: '$RESEND_API_KEY'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email'
  routes:
    - matchers:
        - severity = critical
      receiver: 'email'
      repeat_interval: 1h

receivers:
  - name: 'email'
    email_configs:
      - to: 'kieger6600@gmail.com'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} — {{ .GroupLabels.job }}'

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'job']
