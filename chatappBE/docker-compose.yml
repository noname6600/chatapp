# ─── Shared env-var block for all realtime-edge instances ────────────────────
# YAML <<: merge only deep-merges at the level it is applied. If we anchored
# the whole service and the child re-defined "environment:", the child's block
# would silently replace the base's (not merge with it), leaving Instance 2
# without Redis/Kafka/JWT config. Anchoring at the env-var mapping level and
# applying <<: inside each service's "environment:" block is the correct fix.
x-realtime-edge-env: &realtime-edge-env
  PORT: 8090
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092,chatapp-kafka:9092}
  SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
  SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://auth-service:8081/.well-known/jwks.json}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-http://chat-service:8083}
  PRESENCE_SERVICE_URL: ${PRESENCE_SERVICE_URL:-http://presence-service:8084}
  NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8086}
  FRIENDSHIP_SERVICE_URL: ${FRIENDSHIP_SERVICE_URL:-http://friendship-service:8085}
  INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
  REALTIME_DELIVERY_QUEUE_WORKERS: 16
  REALTIME_WS_SIDE_EFFECTS_WORKERS: 16
  REALTIME_WS_SIDE_EFFECTS_QUEUE_CAPACITY: 2000

# ─── OpenTelemetry Java agent env vars (merged into every microservice) ───────
# The agent attaches at JVM startup via JAVA_TOOL_OPTIONS.
# OTEL_SERVICE_NAME is set per-service below.
# Metrics and logs exporters are disabled — Prometheus scrapes metrics directly
# and Promtail ships logs to Loki; only traces go to Tempo.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
  # Keep 20% of successful traces; errors are always kept via parentbased sampler.
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.2"

services:

  # ─────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chatapp-postgres
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_DATABASE_NAME: ${AUTH_DATABASE_NAME:-auth_service}
      USER_DATABASE_NAME: ${USER_DATABASE_NAME:-user_service}
      CHAT_DATABASE_NAME: ${CHAT_DATABASE_NAME:-chat_service}
      FRIENDSHIP_DATABASE_NAME: ${FRIENDSHIP_DATABASE_NAME:-friendship_service}
      NOTIFICATION_DATABASE_NAME: ${NOTIFICATION_DATABASE_NAME:-notification_service}
      PRESENCE_DATABASE_NAME: ${PRESENCE_DATABASE_NAME:-presence_service}
      VOICE_DATABASE_NAME: ${VOICE_DATABASE_NAME:-voice_service}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    networks:
      - chatapp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    command: redis-server --notify-keyspace-events Kx --appendonly yes
    networks:
      - chatapp-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: chatapp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - chatapp-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: chatapp-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - chatapp-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────
  # LIVEKIT (SFU + built-in STUN/TURN)
  # ─────────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.13.3
    container_name: chatapp-livekit
    command:
      - --config
      - /livekit.yaml
      - --keys
      - "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_at_least_32_chars_long}"
      - --node-ip
      - "${VPS_PUBLIC_IP}"
    volumes:
      - ./livekit/livekit.yaml:/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7881:7881/udp"
      - "3478:3478/udp"
      - "50000-50500:50000-50500/udp"
    networks:
      - chatapp-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # OBSERVABILITY
  # ─────────────────────────────────────────────────────────

  # Downloads the OTel Java agent JAR once into a named volume shared by all services.
  # Services depend on this completing before they start so the JAR is guaranteed present.
  otel-agent-init:
    image: alpine:3.19
    container_name: chatapp-otel-agent-init
    volumes:
      - otel-agent:/otel
    command: >
      sh -c "[ -f /otel/opentelemetry-javaagent.jar ] ||
      (apk add -q --no-cache wget &&
      wget -q -O /otel/opentelemetry-javaagent.jar
      https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.10.0/opentelemetry-javaagent.jar &&
      echo 'OTel agent downloaded')"
    restart: "no"
    networks:
      - chatapp-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: chatapp-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - chatapp-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: chatapp-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - chatapp-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.0
    container_name: chatapp-promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./docker/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - chatapp-net
    restart: unless-stopped
    depends_on:
      - loki

  # ─────────────────────────────────────────────────────────
  # MICROSERVICES
  # ─────────────────────────────────────────────────────────
  auth-service: &auth-service-base
    container_name: chatappbe-auth-service
    hostname: chatappbe-auth-service
    mem_limit: 768m
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "auth-service"
      PORT: 8081
      AUTH_DATABASE_URL: jdbc:postgresql://postgres:5432/${AUTH_DATABASE_NAME:-auth_service}
      AUTH_DATABASE_USER: ${POSTGRES_USER:-postgres}
      AUTH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092,chatapp-kafka:9092}
      USER_SERVICE_BASE_URL: ${USER_SERVICE_BASE_URL:-http://user-service:8082/api/v1/users}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_REDIRECT_BASE_URL: ${OAUTH2_REDIRECT_BASE_URL:-http://localhost:8080}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
    volumes:
      - otel-agent:/otel:ro
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

  auth-service-2:
    <<: *auth-service-base
    container_name: chatappbe-auth-service-2
    hostname: chatappbe-auth-service-2
    networks:
      chatapp-net:
        aliases:
          - auth-service

  user-service: &user-service-base
    container_name: chatappbe-user-service
    hostname: chatappbe-user-service
    mem_limit: 640m
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "user-service"
      PORT: 8082
      USER_DATABASE_URL: jdbc:postgresql://postgres:5432/${USER_DATABASE_NAME:-user_service}
      USER_DATABASE_USER: ${POSTGRES_USER:-postgres}
      USER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092,chatapp-kafka:9092}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://auth-service:8081/.well-known/jwks.json}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - otel-agent:/otel:ro
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

  user-service-2:
    <<: *user-service-base
    container_name: chatappbe-user-service-2
    hostname: chatappbe-user-service-2
    networks:
      chatapp-net:
        aliases:
          - user-service

  chat-service: &chat-service-base
    container_name: chatappbe-chat-service
    hostname: chatappbe-chat-service
    mem_limit: 768m
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "chat-service"
      PORT: 8083
      CHAT_DATABASE_URL: jdbc:postgresql://postgres:5432/${CHAT_DATABASE_NAME:-chat_service}
      CHAT_DATABASE_USER: ${POSTGRES_USER:-postgres}
      CHAT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092,chatapp-kafka:9092}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://auth-service:8081/.well-known/jwks.json}
      SERVICES_USER_URL: ${SERVICES_USER_URL:-http://user-service:8082}
      SERVICES_FRIENDSHIP_URL: ${SERVICES_FRIENDSHIP_URL:-http://friendship-service:8085}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
    volumes:
      - otel-agent:/otel:ro
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

  chat-service-2:
    <<: *chat-service-base
    container_name: chatappbe-chat-service-2
    hostname: chatappbe-chat-service-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    networks:
      chatapp-net:
        aliases:
          - chat-service

  presence-service: &presence-service-base
    container_name: chatappbe-presence-service
    hostname: chatappbe-presence-service
    mem_limit: 512m
    build:
      context: .
      dockerfile: presence-service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "presence-service"
      PORT: 8084
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092,chatapp-kafka:9092}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://auth-service:8081/.well-known/jwks.json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-http://chat-service:8083}
    volumes:
      - otel-agent:/otel:ro
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

  presence-service-2:
    <<: *presence-service-base
    container_name: chatappbe-presence-service-2
    hostname: chatappbe-presence-service-2
    depends_on:
      redis:
        condition: service_healthy
