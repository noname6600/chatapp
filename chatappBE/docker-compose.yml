  realtime-edge-service-2:
    <<: *realtime-edge-service-base
    container_name: chatappbe-realtime-edge-service-2
    hostname: chatappbe-realtime-edge-service-2
    environment:
      <<: [*otel-env, *realtime-edge-env]
      OTEL_SERVICE_NAME: "realtime-edge-service"
      REALTIME_INSTANCE_ID: chatappbe-realtime-edge-service-2
    networks:
      chatapp-net:
        aliases:
          - realtime-edge-service

  upload-service: &upload-service-base
    container_name: chatappbe-upload-service
    hostname: chatappbe-upload-service
    mem_limit: 384m
    build:
      context: .
      dockerfile: upload-service/Dockerfile
    depends_on:
      auth-service:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "upload-service"
      PORT: 8088
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://auth-service:8081/.well-known/jwks.json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      UPLOAD_CONFIRM_PREPARE_TOKEN_SECRET: ${UPLOAD_CONFIRM_PREPARE_TOKEN_SECRET}
    volumes:
      - otel-agent:/otel:ro
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

  upload-service-2:
    <<: *upload-service-base
    container_name: chatappbe-upload-service-2
    hostname: chatappbe-upload-service-2
    networks:
      chatapp-net:
        aliases:
          - upload-service

  # ─────────────────────────────────────────────────────────
  # VOICE SERVICE
  # ─────────────────────────────────────────────────────────
  voice-service: &voice-service-base
    container_name: chatappbe-voice-service
    hostname: chatappbe-voice-service
    mem_limit: 640m
    build:
      context: .
      dockerfile: voice-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      livekit:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "voice-service"
      PORT: 8091
      VOICE_DATABASE_URL: jdbc:postgresql://postgres:5432/${VOICE_DATABASE_NAME:-voice_service}
      VOICE_DATABASE_USER: ${POSTGRES_USER:-postgres}
      VOICE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092,chatapp-kafka:9092}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://auth-service:8081/.well-known/jwks.json}
      SERVICES_USER_URL: ${SERVICES_USER_URL:-http://user-service:8082}
      SERVICES_CHAT_URL: ${SERVICES_CHAT_URL:-http://chat-service:8083}
      SERVICES_FRIENDSHIP_URL: ${SERVICES_FRIENDSHIP_URL:-http://friendship-service:8085}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret_at_least_32_chars_long}
      LIVEKIT_URL_INTERNAL: ${LIVEKIT_URL_INTERNAL:-ws://chatapp-livekit:7880}
      LIVEKIT_URL_EXTERNAL: ${LIVEKIT_URL_EXTERNAL:-ws://localhost:7880}
      LIVEKIT_ENABLED: ${LIVEKIT_ENABLED:-true}
    volumes:
      - otel-agent:/otel:ro
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

  voice-service-2:
    <<: *voice-service-base
    container_name: chatappbe-voice-service-2
    hostname: chatappbe-voice-service-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    networks:
      chatapp-net:
        aliases:
          - voice-service

  # ─────────────────────────────────────────────────────────
  # API GATEWAY
  # ─────────────────────────────────────────────────────────
  gateway-service: &gateway-service-base
    container_name: chatappbe-gateway-service
    hostname: chatappbe-gateway-service
    mem_limit: 640m
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      friendship-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      realtime-edge-service:
        condition: service_healthy
      upload-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "gateway-service"
      PORT: 8080
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST:-auth-service}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-8081}
      USER_SERVICE_HOST: ${USER_SERVICE_HOST:-user-service}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT:-8082}
      CHAT_SERVICE_HOST: ${CHAT_SERVICE_HOST:-chat-service}
      CHAT_SERVICE_PORT: ${CHAT_SERVICE_PORT:-8083}
      PRESENCE_SERVICE_HOST: ${PRESENCE_SERVICE_HOST:-presence-service}
      PRESENCE_SERVICE_PORT: ${PRESENCE_SERVICE_PORT:-8084}
      FRIENDSHIP_SERVICE_HOST: ${FRIENDSHIP_SERVICE_HOST:-friendship-service}
      FRIENDSHIP_SERVICE_PORT: ${FRIENDSHIP_SERVICE_PORT:-8085}
      NOTIFICATION_SERVICE_HOST: ${NOTIFICATION_SERVICE_HOST:-notification-service}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-8086}
      UPLOAD_SERVICE_HOST: ${UPLOAD_SERVICE_HOST:-upload-service}
      UPLOAD_SERVICE_PORT: ${UPLOAD_SERVICE_PORT:-8088}
      REALTIME_EDGE_SERVICE_HOST: ${REALTIME_EDGE_SERVICE_HOST:-realtime-edge-service}
      REALTIME_EDGE_SERVICE_PORT: ${REALTIME_EDGE_SERVICE_PORT:-8090}
      VOICE_SERVICE_HOST: ${VOICE_SERVICE_HOST:-voice-service}
      VOICE_SERVICE_PORT: ${VOICE_SERVICE_PORT:-8091}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      GATEWAY_JWT_CLOCK_SKEW_SECONDS: ${GATEWAY_JWT_CLOCK_SKEW_SECONDS:-60}
    volumes:
      - otel-agent:/otel:ro
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 420s

  gateway-service-2:
    <<: *gateway-service-base
    container_name: chatappbe-gateway-service-2
    hostname: chatappbe-gateway-service-2

  # ─────────────────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────────────────
  frontend: &frontend-base
    container_name: chatappbe-frontend
    build:
      context: ../chatappFE
      dockerfile: Dockerfile
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────
  # EDGE PROXY
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: chatapp-nginx
    depends_on:
      frontend:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
      gateway-service-2:
        condition: service_healthy
      grafana:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - chatapp-net
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: chatapp-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["certbot"]
    command: ["--version"]
    networks:
      - chatapp-net
    restart: "no"

  kafka-setup:
    image: confluentinc/cp-kafka:7.6.0
    container_name: chatapp-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - chatapp-net
    restart: "no"
    command: >
      bash -c "
        echo 'Creating/updating Kafka topics...' &&
        for topic in chat.message.sent chat.message.events chat.reaction.updated friendship.events friendship.request.events notification.realtime account.created system.dead-letter system.retry voice.room.events voice.call.events; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 2 --replication-factor 1 &&
          kafka-topics --bootstrap-server kafka:9092 --alter --topic $$topic --partitions 2 2>/dev/null || true;
        done &&
        echo 'Kafka topics ready.'
      "

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: chatapp-kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
      - "--topic.filter=.*"
      - "--group.filter=.*"
      - "--web.listen-address=:9308"
    networks:
      - chatapp-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: chatapp-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    pid: host
    networks:
      - chatapp-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: chatapp-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--config.expand-env=true'
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - chatapp-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: chatapp-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    networks:
      - chatapp-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: chatapp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://metrics.chatweb.nani.id.vn
      GF_SERVER_DOMAIN: metrics.chatweb.nani.id.vn
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - chatapp-net
    restart: unless-stopped

  certbot-renew:
    image: certbot/certbot:latest
    container_name: chatapp-certbot-renew
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot --webroot-path=/var/www/certbot;
      sleep 12h & wait $${!};
      done"
    networks:
      - chatapp-net
    restart: unless-stopped

# ─────────────────────────────────────────────────────────
# NETWORKS & VOLUMES
# ─────────────────────────────────────────────────────────
networks:
  chatapp-net:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  otel-agent:
  tempo-data:
  loki-data:
