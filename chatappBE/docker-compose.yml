  realtime-edge-service: &realtime-edge-service-base
    container_name: chatappbe-realtime-edge-service
    hostname: chatappbe-realtime-edge-service
    mem_limit: 640m
    build:
      context: .
      dockerfile: realtime-edge-service/Dockerfile
    depends_on:
      redis:
