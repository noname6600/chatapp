        aliases:
          - presence-service

  friendship-service: &friendship-service-base
    container_name: chatappbe-friendship-service
    hostname: chatappbe-friendship-service
    mem_limit: 640m
    build:
      context: .
      dockerfile: friendship-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "friendship-service"
      PORT: 8085
      FRIENDSHIP_DATABASE_URL: jdbc:postgresql://postgres:5432/${FRIENDSHIP_DATABASE_NAME:-friendship_service}
      FRIENDSHIP_DATABASE_USER: ${POSTGRES_USER:-postgres}
      FRIENDSHIP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092,chatapp-kafka:9092}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-http://auth-service:8081/.well-known/jwks.json}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8082}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-}
    volumes:
      - otel-agent:/otel:ro
    networks:
      - chatapp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 360s

  friendship-service-2:
    <<: *friendship-service-base
    container_name: chatappbe-friendship-service-2
    hostname: chatappbe-friendship-service-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
