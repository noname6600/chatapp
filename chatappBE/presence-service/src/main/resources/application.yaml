server:
  port: ${PORT:8084}

spring:
  application:
    name: presence-service

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}



# ======================
# ACTUATOR
# ======================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true


common:
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}"
      allowed-methods: "*"
      allowed-headers: "*"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId}]"

presence:
  auto-away-threshold-seconds: 60
  redis:
    listener:
      enabled: ${PRESENCE_REDIS_LISTENER_ENABLED:true}
    keyspace-notification:
      check:
        enabled: ${PRESENCE_REDIS_KEYSPACE_CHECK_ENABLED:true}
        fail-on-missing: ${PRESENCE_REDIS_KEYSPACE_CHECK_FAIL_ON_MISSING:false}

services:
  chat:
    url: ${CHAT_SERVICE_URL:http://localhost:8083}
    http:
      connect-timeout-ms: ${CHAT_HTTP_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${CHAT_HTTP_READ_TIMEOUT_MS:2000}

internal:
  auth:
    header: ${INTERNAL_AUTH_HEADER:X-Internal-Service-Token}
    token: ${INTERNAL_AUTH_TOKEN:}

